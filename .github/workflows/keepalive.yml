# Keeps the free services awake: Supabase pauses a Free project after 7 days without database activity.
# Once a day this wakes the site and lets it make one tiny Supabase request (at most every 6 hours).
#
# Cost: free. Public repositories get unlimited GitHub Actions minutes, and this job takes a few seconds.
# Turn it on: GitHub repo → Settings → Secrets and variables → Actions → Variables → New repository variable
#   Name: SITE_URL    Value: https://your-site (e.g. https://plumb-contact.onrender.com)
# Without SITE_URL the job does nothing.
name: Keep free services awake

on:
  schedule:
    - cron: '23 5 * * *'   # every day, 05:23 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the site and touch Supabase
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL is not set, nothing to do."; exit 0; fi
          # A sleeping Render free server takes up to a minute to wake.
          curl -fsS --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 "${SITE_URL%/}/api/keepalive"
          echo
